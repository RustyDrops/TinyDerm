[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyderm-lab"
version = "0.1.0"
description = "TinyDerm Lab: Autonomous Local Medical-Image Compression Research Prototype"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "TinyDerm Research Team" }]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=1.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "Pillow>=9.5.0",
    "albumentations>=1.3.0",
    "PyYAML>=6.0",
    "streamlit>=1.28.0",
    "plotly>=5.15.0",
    "psutil>=5.9.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",
    "tqdm>=4.65.0",
    "requests>=2.31.0",
    "isic-cli>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]
